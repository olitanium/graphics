[workspace]
resolver = "3"
members = [
    "game",
    "colour",
    "engine",
    "utils",
    "graphics",
    "quaternion",
    "dual_number",
    "linear_algebra",
    "multi_zip",
    "infinite_window",
    "localrc",
    "fixed_point", "bezier"
, "handle_vec", "triangle-intersection"]


[workspace.lints.clippy]
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
#must_use_candidate = "deny"
#pedantic = "deny"
